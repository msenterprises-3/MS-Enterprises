services:
  - type: web
    name: ms-furniture-gallery
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: MS_Enterprises_Project
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 4 --threads 2 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false