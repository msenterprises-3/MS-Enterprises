version: '3.8'

services:
  web:
    build: .
    container_name: ms_furniture_gallery
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=production_secret_key_ms_furniture_gallery_2026
      - PORT=5000
    restart: unless-stopped
    volumes:
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
